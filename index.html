<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloomle</title>
<style>
  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: #f4f7f2;
    color: #1d2b22;
    margin: 0;
    padding: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { margin: 4px 0 2px; font-size: 26px; letter-spacing: 3px; }
  .subtitle { font-size: 13px; color: #5d6f62; margin-bottom: 12px; }
  #board { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .row { display: flex; gap: 6px; justify-content: center; }
  .tile {
    width: 48px; height: 48px;
    border: 2px solid #c9d6cb;
    border-radius: 4px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; text-transform: uppercase;
  }
  .tile.correct { background: #2e8b57; border-color: #2e8b57; color: #fff; }
  .tile.present { background: #e0b33c; border-color: #e0b33c; color: #fff; }
  .tile.absent  { background: #8c9a90; border-color: #8c9a90; color: #fff; }
  #message { min-height: 22px; font-weight: 600; margin-bottom: 8px; text-align: center; }
  #keyboard { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .krow { display: flex; gap: 5px; }
  .key {
    min-width: 30px; height: 44px; padding: 0 5px;
    border: none; border-radius: 4px;
    background: #d9e3dc; color: #1d2b22;
    font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .key.wide { min-width: 56px; font-size: 11px; }
  .key.correct { background: #2e8b57; color: #fff; }
  .key.present { background: #e0b33c; color: #fff; }
  .key.absent  { background: #8c9a90; color: #fff; }
  #share {
    display: none; margin-top: 12px; padding: 10px 18px;
    border: none; border-radius: 6px; background: #2e8b57; color: #fff;
    font-size: 15px; font-weight: 700; cursor: pointer;
  }
  /* Compact layout for narrow Notion side columns */
  body { padding: 6px; }
  h1 { font-size: 18px; letter-spacing: 2px; margin: 0; }
  .subtitle { font-size: 10px; margin-bottom: 6px; }
  #board { gap: 3px; margin-bottom: 6px; }
  .row { gap: 3px; }
  .tile { width: 30px; height: 30px; font-size: 15px; border-width: 1px; }
  #message { font-size: 12px; min-height: 16px; margin-bottom: 4px; }
  #keyboard { gap: 3px; width: 100%; }
  .krow { gap: 3px; width: 100%; justify-content: center; }
  .key { flex: 1; min-width: 0; max-width: 24px; height: 30px; padding: 0; font-size: 11px; }
  .key.wide { flex: 1.6; min-width: 0; max-width: none; font-size: 9px; }
  #share { padding: 6px 10px; font-size: 12px; margin-top: 6px; }
</style>
</head>
<body>

<h1>BLOOMLE</h1>
<div class="subtitle" id="week"></div>
<div id="board"></div>
<div id="message"></div>
<div id="keyboard"></div>
<button id="share">Copy result</button>

<script>
// ---------- SETTINGS ----------
// The word list lives in words.json, next to this file on GitHub.
// Edit that file to change words. Each word must be 5 letters.
const WORDS_URL = "words.json";

// ---------- WEEK LOGIC ----------
// Weeks run Monday to Sunday. Week 0 starts on Monday, Jan 5, 2026.
const EPOCH_MONDAY = Date.UTC(2026, 0, 5);
const DAY_MS = 86400000;

function getWeekInfo() {
  const now = new Date();
  const daysSinceMonday = (now.getDay() + 6) % 7; // Mon=0 ... Sun=6
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday);
  const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
  const mondayUTC = Date.UTC(monday.getFullYear(), monday.getMonth(), monday.getDate());
  const weekNumber = Math.round((mondayUTC - EPOCH_MONDAY) / (7 * DAY_MS));
  // ISO week number (week 1 is the first week with a Thursday in January).
  // Uses the Thursday of this week to find which year and week it belongs to.
  const thursday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 3);
  const dayOfYear = Math.round(
    (Date.UTC(thursday.getFullYear(), thursday.getMonth(), thursday.getDate()) -
     Date.UTC(thursday.getFullYear(), 0, 1)) / DAY_MS
  ) + 1;
  const isoWeek = Math.ceil(dayOfYear / 7);

  return { monday, sunday, weekNumber, isoWeek, key: "bloomle-week-" + weekNumber };
}

// Turns Monday and Sunday into a label like "Oct 12 – 18, 2026"
function formatWeekRange(monday, sunday) {
  const mon = (d) => d.toLocaleString("en-US", { month: "short" });
  const year = sunday.getFullYear();
  if (monday.getMonth() === sunday.getMonth()) {
    return `${mon(monday)} ${monday.getDate()} – ${sunday.getDate()}, ${year}`;
  }
  return `${mon(monday)} ${monday.getDate()} – ${mon(sunday)} ${sunday.getDate()}, ${year}`;
}

// ---------- GAME STATE ----------
const info = getWeekInfo();
let answer = "";
let guesses = [];
let current = "";
let over = false;

const saved = JSON.parse(localStorage.getItem(info.key) || "null");
if (saved) { guesses = saved.guesses; over = saved.over; }

// ---------- SCORING ----------
// Returns one status per letter: "correct", "present", or "absent".
function scoreGuess(guess, target) {
  const result = Array(5).fill("absent");
  const remaining = {};

  // Pass 1: exact matches (green)
  for (let i = 0; i < 5; i++) {
    if (guess[i] === target[i]) {
      result[i] = "correct";
    } else {
      remaining[target[i]] = (remaining[target[i]] || 0) + 1;
    }
  }
  // Pass 2: right letter, wrong spot (yellow), while letters remain
  for (let i = 0; i < 5; i++) {
    if (result[i] !== "correct" && remaining[guess[i]] > 0) {
      result[i] = "present";
      remaining[guess[i]]--;
    }
  }
  return result;
}

// ---------- RENDERING ----------
const board = document.getElementById("board");
const keyboard = document.getElementById("keyboard");
const message = document.getElementById("message");
const shareBtn = document.getElementById("share");

document.getElementById("week").textContent =
  "Week " + info.isoWeek + " · " + formatWeekRange(info.monday, info.sunday);

function renderBoard() {
  board.innerHTML = "";
  for (let r = 0; r < 6; r++) {
    const row = document.createElement("div");
    row.className = "row";
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      if (r < guesses.length) {
        tile.textContent = guesses[r].word[c];
        tile.classList.add(guesses[r].result[c]);
      } else if (r === guesses.length && c < current.length) {
        tile.textContent = current[c];
      }
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

// Keyboard keys take on the best status each letter has earned so far
function renderKeyboard() {
  const status = {};
  const rank = { absent: 1, present: 2, correct: 3 };
  for (const g of guesses) {
    for (let i = 0; i < 5; i++) {
      const letter = g.word[i];
      if (!status[letter] || rank[g.result[i]] > rank[status[letter]]) {
        status[letter] = g.result[i];
      }
    }
  }

  const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  keyboard.innerHTML = "";
  rows.forEach((letters, idx) => {
    const krow = document.createElement("div");
    krow.className = "krow";
    if (idx === 2) krow.appendChild(makeKey("ENTER", "wide"));
    for (const l of letters) krow.appendChild(makeKey(l, "", status[l]));
    if (idx === 2) krow.appendChild(makeKey("BACK", "wide"));
    keyboard.appendChild(krow);
  });
}

function makeKey(label, extraClass = "", status = "") {
  const btn = document.createElement("button");
  btn.className = ("key " + extraClass + " " + status).trim();
  btn.textContent = label;
  btn.onclick = () => handleInput(label);
  return btn;
}

function showMessage(text, persist = false) {
  message.textContent = text;
  if (text && !persist) {
    setTimeout(() => { if (message.textContent === text) message.textContent = ""; }, 1500);
  }
}

function render() {
  renderBoard();
  renderKeyboard();
  if (over) {
    const won = guesses.length && guesses[guesses.length - 1].word === answer;
    showMessage(won
      ? "Nice! Solved in " + guesses.length + "."
      : "The word was " + answer + ".", true);
    shareBtn.style.display = "inline-block";
  }
}

// ---------- INPUT ----------
function handleInput(key) {
  if (!answer || over) return;
  key = key.toUpperCase();

  if (key === "BACK" || key === "BACKSPACE") {
    current = current.slice(0, -1);
  } else if (key === "ENTER") {
    submitGuess();
  } else if (/^[A-Z]$/.test(key) && current.length < 5) {
    current += key;
  }
  render();
}

function submitGuess() {
  if (current.length < 5) {
    showMessage("Not enough letters");
    return;
  }
  const result = scoreGuess(current, answer);
  guesses.push({ word: current, result });
  current = "";

  if (guesses[guesses.length - 1].word === answer || guesses.length === 6) {
    over = true;
  }
  localStorage.setItem(info.key, JSON.stringify({ guesses, over }));
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleInput("ENTER");
  else if (e.key === "Backspace") handleInput("BACK");
  else if (/^[a-zA-Z]$/.test(e.key)) handleInput(e.key);
});

// ---------- SHARE ----------
// Colored-square summary, like Wordle, without revealing the word
shareBtn.onclick = () => {
  const squares = { correct: "🟩", present: "🟨", absent: "⬜" };
  const grid = guesses.map(g => g.result.map(r => squares[r]).join("")).join("\n");
  const won = guesses[guesses.length - 1].word === answer;
  const text = "Bloomle " + formatWeekRange(info.monday, info.sunday) + " — "
             + (won ? guesses.length : "X") + "/6\n" + grid;
  navigator.clipboard.writeText(text)
    .then(() => showMessage("Copied to clipboard"))
    .catch(() => showMessage("Copy failed. Try again."));
};

// ---------- START ----------
// Load the word list, then pick this week's word
fetch(WORDS_URL)
  .then(res => {
    if (!res.ok) throw new Error("Could not load " + WORDS_URL);
    return res.json();
  })
  .then(words => {
    answer = words[((info.weekNumber % words.length) + words.length) % words.length];
    render();
  })
  .catch(err => {
    showMessage("Couldn't load this week's word. Check that words.json is uploaded.", true);
    console.error(err);
  });
</script>
</body>
</html>
