<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bloomle</title>
<style>
  /* The game is designed at a fixed width (300px). JavaScript measures the
     real size of the content and scales it to fill the box it sits in. */
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #f4f7f2;
    font-family: system-ui, -apple-system, sans-serif;
    color: #1d2b22;
  }
  [hidden] { display: none !important; }
  #wrap {
    position: relative;
    margin: 0 auto;
  }
  #game {
    position: absolute;
    top: 0; left: 0;
    width: 300px;
    transform-origin: top left;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo { height: 40px; width: auto; display: block; margin-bottom: 2px; }
  .subtitle { font-size: 12px; color: #5d6f62; margin: 1px 0 4px; }
  #board { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .row { display: flex; gap: 6px; justify-content: center; }
  .tile {
    width: 44px; height: 44px;
    border: 2px solid #c9d6cb;
    border-radius: 4px;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700; text-transform: uppercase;
    box-sizing: border-box;
  }
  .tile.correct { background: #0F4C82; border-color: #0F4C82; color: #fff; }
  .tile.present { background: #91A8D0; border-color: #91A8D0; color: #1d2b22; }
  .tile.absent  { background: #8c9a90; border-color: #8c9a90; color: #fff; }
  #message { min-height: 16px; font-size: 13px; font-weight: 600; margin-bottom: 4px; text-align: center; }
  #keyboard { display: flex; flex-direction: column; gap: 5px; align-items: center; margin-bottom: 4px; }
  .krow { display: flex; gap: 4px; }
  .key {
    width: 26px; height: 38px; padding: 0;
    border: none; border-radius: 4px;
    background: #d9e3dc; color: #1d2b22;
    font-size: 13px; font-weight: 700; cursor: pointer;
  }
  .key.wide { width: 40px; font-size: 10px; }
  .key.correct { background: #0F4C82; color: #fff; }
  .key.present { background: #91A8D0; color: #1d2b22; }
  .key.absent  { background: #8c9a90; color: #fff; }

  /* "Suggest a word" link, shown after the game ends */
  .suggest-btn {
    display: block; width: fit-content; margin: 0 auto 6px; padding: 6px 14px;
    border-radius: 6px; background: #0F4C82; color: #fff;
    font-size: 13px; font-weight: 700; text-decoration: none;
  }

  /* Info button, fixed in the top-left corner of the embed */
  .info-btn {
    position: fixed; top: 6px; left: 6px; z-index: 20;
    width: 20px; height: 20px;
    border: 2px solid #0F4C82; border-radius: 50%;
    background: #fff; color: #0F4C82;
    font-size: 11px; font-weight: 800; font-family: Georgia, serif;
    cursor: pointer; padding: 0; line-height: 16px;
  }

  /* How-to-play popup, fills the game area */
  .info-popup {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    box-sizing: border-box;
    background: #fff;
    border: 2px solid #0F4C82; border-radius: 8px;
    padding: 16px 18px;
    display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    font-size: 18px; line-height: 1.4;
    z-index: 10;
  }
  .info-popup h2 { margin: 0; font-size: 26px; color: #0F4C82; }
  .info-popup p { margin: 0; }
  .info-popup .new-word { color: #0F4C82; font-weight: 700; }
  .info-popup .legend { display: flex; flex-direction: column; gap: 6px; }
  .sample {
    display: inline-block; width: 18px; height: 18px;
    border-radius: 3px; vertical-align: middle; margin-right: 8px;
  }
  .sample.correct { background: #0F4C82; }
  .sample.present { background: #91A8D0; }
  .sample.absent  { background: #8c9a90; }
  .suggest-link {
    display: block; text-align: center;
    font-weight: 700; color: #0F4C82;
    text-decoration: underline; cursor: pointer;
  }
  .info-close {
    align-self: stretch;
    padding: 12px 16px; border: none; border-radius: 8px;
    background: #0F4C82; color: #fff;
    font-size: 20px; font-weight: 700; cursor: pointer;
  }
</style>
</head>
<body>

<button id="info-btn" class="info-btn" aria-label="How to play">i</button>

<div id="wrap">
  <div id="game">
    <img class="logo" src="logo.png" alt="Bloomle">
    <div class="subtitle" id="week"></div>
    <div id="board"></div>
    <a id="suggest-btn" class="suggest-btn" hidden target="_blank" rel="noopener">Suggest a word</a>
    <div id="message"></div>
    <div id="keyboard"></div>

    <div id="info" class="info-popup" hidden>
      <h2>How to play</h2>
      <p>Guess this week's word in 6 tries.</p>
      <p>The word is about <strong>Bloomineral</strong> or our team.</p>
      <p class="new-word">New word every Monday!</p>
      <div class="legend">
        <p><span class="sample correct"></span>Dark blue: right letter, right spot</p>
        <p><span class="sample present"></span>Light blue: right letter, wrong spot</p>
        <p><span class="sample absent"></span>Grey: letter not in the word</p>
      </div>
      <a id="suggest-link" class="suggest-link" target="_blank" rel="noopener">Click here to suggest new words</a>
      <button id="info-close" class="info-close">Got it</button>
    </div>
  </div>
</div>

<script>
// ---------- SETTINGS ----------
// The word list lives in words.json, next to this file on GitHub.
// Edit that file to change words. Each word must be 5 letters.
const WORDS_URL = "words.json";

// Google Form for word suggestions. Paste the form's link between the quotes.
// While this is empty, the suggestion links stay hidden.
const FORM_URL = "https://forms.gle/qcvvMUMTcUhTyZ1n8";

// ---------- FIT TO BOX ----------
// Measures the game's real size, then scales it to fill the box it's in
// while keeping its proportions.
function fitGame() {
  const game = document.getElementById("game");
  const wrap = document.getElementById("wrap");
  const w = game.offsetWidth;
  const h = game.offsetHeight;
  const scale = Math.min(window.innerWidth / w, window.innerHeight / h);
  game.style.transform = "scale(" + scale + ")";
  wrap.style.width = (w * scale) + "px";
  wrap.style.height = (h * scale) + "px";
}
window.addEventListener("resize", fitGame);

// ---------- WEEK LOGIC ----------
// Weeks run Monday to Sunday. Week 0 starts on Monday, Jan 5, 2026.
const EPOCH_MONDAY = Date.UTC(2026, 0, 5);
const DAY_MS = 86400000;

function getWeekInfo() {
  const now = new Date();
  const daysSinceMonday = (now.getDay() + 6) % 7; // Mon=0 ... Sun=6
  const monday = new Date(now.getFullYear(), now.getMonth(), now.getDate() - daysSinceMonday);
  const sunday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 6);
  const mondayUTC = Date.UTC(monday.getFullYear(), monday.getMonth(), monday.getDate());
  const weekNumber = Math.round((mondayUTC - EPOCH_MONDAY) / (7 * DAY_MS));

  // ISO week number (week 1 is the first week with a Thursday in January).
  const thursday = new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + 3);
  const dayOfYear = Math.round(
    (Date.UTC(thursday.getFullYear(), thursday.getMonth(), thursday.getDate()) -
     Date.UTC(thursday.getFullYear(), 0, 1)) / DAY_MS
  ) + 1;
  const isoWeek = Math.ceil(dayOfYear / 7);

  return { monday, sunday, weekNumber, isoWeek, key: "bloomle-week-" + weekNumber };
}

// Turns Monday and Sunday into a label like "Oct 12 – 18, 2026"
function formatWeekRange(monday, sunday) {
  const mon = (d) => d.toLocaleString("en-US", { month: "short" });
  const year = sunday.getFullYear();
  if (monday.getMonth() === sunday.getMonth()) {
    return `${mon(monday)} ${monday.getDate()} – ${sunday.getDate()}, ${year}`;
  }
  return `${mon(monday)} ${monday.getDate()} – ${mon(sunday)} ${sunday.getDate()}, ${year}`;
}

// ---------- GAME STATE ----------
const info = getWeekInfo();
let answer = "";
let guesses = [];
let current = "";
let over = false;

const saved = JSON.parse(localStorage.getItem(info.key) || "null");
if (saved) { guesses = saved.guesses; over = saved.over; }

// ---------- SCORING ----------
// Returns one status per letter: "correct", "present", or "absent".
function scoreGuess(guess, target) {
  const result = Array(5).fill("absent");
  const remaining = {};

  // Pass 1: exact matches (green)
  for (let i = 0; i < 5; i++) {
    if (guess[i] === target[i]) {
      result[i] = "correct";
    } else {
      remaining[target[i]] = (remaining[target[i]] || 0) + 1;
    }
  }
  // Pass 2: right letter, wrong spot (yellow), while letters remain
  for (let i = 0; i < 5; i++) {
    if (result[i] !== "correct" && remaining[guess[i]] > 0) {
      result[i] = "present";
      remaining[guess[i]]--;
    }
  }
  return result;
}

// ---------- RENDERING ----------
const board = document.getElementById("board");
const keyboard = document.getElementById("keyboard");
const message = document.getElementById("message");

document.getElementById("week").textContent =
  "Week " + info.isoWeek + " · " + formatWeekRange(info.monday, info.sunday);

function renderBoard() {
  board.innerHTML = "";
  for (let r = 0; r < 6; r++) {
    const row = document.createElement("div");
    row.className = "row";
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement("div");
      tile.className = "tile";
      if (r < guesses.length) {
        tile.textContent = guesses[r].word[c];
        tile.classList.add(guesses[r].result[c]);
      } else if (r === guesses.length && c < current.length) {
        tile.textContent = current[c];
      }
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

// Keyboard keys take on the best status each letter has earned so far
function renderKeyboard() {
  const status = {};
  const rank = { absent: 1, present: 2, correct: 3 };
  for (const g of guesses) {
    for (let i = 0; i < 5; i++) {
      const letter = g.word[i];
      if (!status[letter] || rank[g.result[i]] > rank[status[letter]]) {
        status[letter] = g.result[i];
      }
    }
  }

  const rows = ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"];
  keyboard.innerHTML = "";
  rows.forEach((letters, idx) => {
    const krow = document.createElement("div");
    krow.className = "krow";
    if (idx === 2) krow.appendChild(makeKey("ENTER", "wide"));
    for (const l of letters) krow.appendChild(makeKey(l, "", status[l]));
    if (idx === 2) krow.appendChild(makeKey("BACK", "wide"));
    keyboard.appendChild(krow);
  });
}

function makeKey(label, extraClass = "", status = "") {
  const btn = document.createElement("button");
  btn.className = ("key " + extraClass + " " + status).trim();
  btn.textContent = label;
  btn.onclick = () => handleInput(label);
  return btn;
}

function showMessage(text, persist = false) {
  message.textContent = text;
  if (text && !persist) {
    setTimeout(() => { if (message.textContent === text) message.textContent = ""; }, 1500);
  }
}

function render() {
  renderBoard();
  renderKeyboard();
  if (over) {
    const won = guesses.length && guesses[guesses.length - 1].word === answer;
    showMessage(won
      ? "Nice! Solved in " + guesses.length + "."
      : "The word was " + answer + ".", true);

    const suggest = document.getElementById("suggest-btn");
    if (FORM_URL) {
      suggest.href = FORM_URL;
      suggest.hidden = false;
    }
  }
  fitGame();
}

// ---------- INPUT ----------
function handleInput(key) {
  if (!answer || over) return;
  key = key.toUpperCase();

  if (key === "BACK" || key === "BACKSPACE") {
    current = current.slice(0, -1);
  } else if (key === "ENTER") {
    submitGuess();
  } else if (/^[A-Z]$/.test(key) && current.length < 5) {
    current += key;
  }
  render();
}

function submitGuess() {
  if (current.length < 5) {
    showMessage("Not enough letters");
    return;
  }
  const result = scoreGuess(current, answer);
  guesses.push({ word: current, result });
  current = "";

  if (guesses[guesses.length - 1].word === answer || guesses.length === 6) {
    over = true;
  }
  localStorage.setItem(info.key, JSON.stringify({ guesses, over }));
}

document.addEventListener("keydown", (e) => {
  if (!document.getElementById("info").hidden) return; // ignore typing while info is open
  if (e.key === "Enter") handleInput("ENTER");
  else if (e.key === "Backspace") handleInput("BACK");
  else if (/^[a-zA-Z]$/.test(e.key)) handleInput(e.key);
});

// ---------- INFO POPUP ----------
// The (i) button opens and closes the popup. "Got it" closes it too.
const infoPopup = document.getElementById("info");
const suggestLink = document.getElementById("suggest-link");

document.getElementById("info-btn").onclick = () => {
  infoPopup.hidden = !infoPopup.hidden;
};
document.getElementById("info-close").onclick = () => {
  infoPopup.hidden = true;
};

// The suggestion link inside the popup only shows once the form link is set
if (FORM_URL) {
  suggestLink.href = FORM_URL;
} else {
  suggestLink.hidden = true;
}

// ---------- START ----------
// Load the word list, then pick this week's word
fetch(WORDS_URL)
  .then(res => {
    if (!res.ok) throw new Error("Could not load " + WORDS_URL);
    return res.json();
  })
  .then(words => {
    answer = words[((info.weekNumber % words.length) + words.length) % words.length];
    render();
  })
  .catch(err => {
    showMessage("Couldn't load this week's word. Check that words.json is uploaded.", true);
    fitGame();
    console.error(err);
  });

// Fit once on load, even before the word list arrives
fitGame();
window.addEventListener("resize", fitGame);
</script>
</body>
</html>
